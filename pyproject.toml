[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-code-generator"
version = "0.1.0"
description = "Generate QR code PNG images from URLs"
requires-python = ">=3.8"
dependencies = [
    "qrcode[pil]>=8.0",
]

[project.scripts]
qr-code-generator = "qrcode_generator:main"

[tool.setuptools]
py-modules = ["qrcode_generator"]
